<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img"><style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.walk{animation:walk 14s linear infinite}@keyframes walk{0%{transform:translate(-80px,0)}38%{transform:translate(420px,0)}52%{transform:translate(420px,0)}100%{transform:translate(980px,0)}}.l1{animation:s1 .5s ease-in-out infinite alternate}.l2{animation:s2 .5s ease-in-out infinite alternate}@keyframes s1{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes s2{from{transform:translateY(-3px)}to{transform:translateY(0)}}.tail2{transform-box:fill-box;transform-origin:100% 100%;animation:tw 1.6s ease-in-out infinite}@keyframes tw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}.blink2{transform-box:fill-box;transform-origin:center;animation:b2 14s infinite}@keyframes b2{0%,42%,48%,100%{transform:scaleY(1)}44%,46%{transform:scaleY(.1)}}</style><rect width="900" height="200" rx="18" fill="#0d1117" stroke="#30363d"/><text x="450.0" y="70" font-size="38" fill="#e6edf3" font-weight="800" text-anchor="middle" >Let's build something.</text><text x="450.0" y="102" font-size="15" fill="#8b949e" font-weight="400" text-anchor="middle" >Open to AI/ML internships and interesting problems. Email is fastest.</text><line x1="40" y1="170" x2="860" y2="170" stroke="#30363d" stroke-dasharray="4 6"/><g transform="translate(0,170)"><g class="walk"><g>

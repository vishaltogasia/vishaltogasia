<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img"><style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}.blink{transform-box:fill-box;transform-origin:center;animation:bl 5s infinite}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.cur{animation:cu 1s steps(1) infinite}@keyframes cu{50%{opacity:0}}</style><rect width="900" height="320" rx="18" fill="#0d1117" stroke="#30363d"/><text x="48" y="84" font-size="12" fill="#818cf8" font-weight="700" text-anchor="start" class="m" letter-spacing="2">HYDERABAD, INDIA</text><text x="48" y="140" font-size="46" fill="#e6edf3" font-weight="800" text-anchor="start" >Vishal Togasia</text><text x="48" y="182" font-size="18" fill="#e6edf3" font-weight="500" text-anchor="start" >AI/ML engineer building RAG and NLP systems</text><text x="48" y="208" font-size="18" fill="#e6edf3" font-weight="500" text-anchor="start" >that go from notebook to production.</text><text x="48" y="252" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" class="m" >B.Tech CSE (AI &amp; ML)  ·  HITAM  ·  class of 2027</text><rect x="540" y="92" width="322" height="176" rx="10" fill="#010409" stroke="#30363d"/><path d="M540 122 V102 Q540 92 550 92 H852 Q862 92 862 102 V122 Z" fill="#1c2128"/><circle cx="558" cy="107" r="4.5" fill="#ff5f56"/><circle cx="574" cy="107" r="4.5" fill="#ffbd2e"/><circle cx="590" cy="107" r="4.5" fill="#27c93f"/><text x="701.0" y="111" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" class="m" >now.txt</text><text x="558" y="148" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start" class="m" >$ cat now.txt</text><text x="558" y="170" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" class="m" >&gt; shipping ML with FastAPI + Docker</text><text x="558" y="192" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" class="m" >&gt; building multi-tenant RAG apps</text><text x="558" y="214" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" class="m" >&gt; intent classifier at 98.5% acc.</text><text x="558" y="236" font-size="12" fill="#34d399" font-weight="400" text-anchor="start" class="m" >&gt; open to AI/ML internships</text><rect class="cur" x="558" y="246" width="7" height="14" fill="#e6edf3"/><g transform="translate(802,92)">
